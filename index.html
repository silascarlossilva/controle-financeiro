<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A0BB5">
<title>Controle Financeiro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23820AD1%22/><rect x=%2216%22 y=%2272%22 width=%2268%22 height=%2210%22 rx=%225%22 fill=%22%23FF7A00%22/><text x=%2250%22 y=%2260%22 font-size=%2244%22 font-family=%22Arial%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22>R$</text></svg>">
<style>
:root{
  --brand:#820AD1; --brand-deep:#4F0A8A; --brand-ink:#7A0BC4; --accent:#FF7A00;
  --bg:#F4F2F8; --card:#FFFFFF; --ink:#1B1530; --ink-2:#6A6480; --line:#E8E4F0;
  --in:#0F7A57; --out:#D12F58; --inv:#B85200;
  --in-solid:#0F7A57; --out-solid:#D12F58; --inv-solid:#B85200;
  --r:20px;
  --shadow:0 1px 2px rgba(27,21,48,.05),0 8px 24px rgba(27,21,48,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#110C1B; --card:#1B1428; --ink:#F2EEFA; --ink-2:#A59DBA; --line:#2C2340;
    --in:#3DD6A3; --out:#FF6F91; --inv:#FFA24A; --brand-ink:#C48BFF; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px;border-radius:8px}
b,.hero-value,.rval,.ptotal{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin-top:0}

.app{max-width:960px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
@media(min-width:760px){.app{padding-bottom:48px}}

/* ---- topo ---- */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 0 10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));box-shadow:inset 0 -3px 0 var(--accent)}
.brand strong{display:block;font-size:17px;line-height:1.15}
.brand small{display:block;color:var(--ink-2);font-size:12px}
.monthnav{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.month{flex:1;background:none;border:0;font-weight:700;padding:8px;border-radius:999px}
.icon{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:none;border:0;color:var(--ink)}
.icon:hover{background:rgba(130,10,209,.10)}
@media(min-width:760px){.top{grid-template-columns:1fr auto auto}.monthnav{grid-column:auto;min-width:290px}}

/* ---- navegação ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:7px 2px;font-size:12px;color:var(--ink-2);border-radius:12px}
.tab.on{color:var(--brand-ink);font-weight:700}
@media(min-width:760px){
  .tabs{position:static;border:0;background:none;padding:0;margin:2px 0 14px;gap:8px;justify-content:flex-start}
  .tab{flex:none;flex-direction:row;gap:8px;font-size:15px;padding:10px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .tab.on{background:var(--brand);color:#fff;border-color:transparent}
}

/* ---- resumo ---- */
.hero{color:#fff;border-radius:28px;padding:22px 20px 18px;margin:6px 0 18px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,0,.42),transparent 55%),linear-gradient(145deg,#8E1AE0 0%,#6A0BB5 55%,#43087F 100%);box-shadow:0 14px 34px rgba(95,10,170,.28)}
.hero-label{margin:0;opacity:.88;font-size:14px}
.hero-value{margin:2px 0 0;font-size:clamp(34px,9vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero-value.neg{color:#FFC2D1}
.hero-note{margin:4px 0 16px;opacity:.75;font-size:13px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-stats div{background:rgba(255,255,255,.13);border-radius:14px;padding:10px}
.hero-stats span{display:block;font-size:12px;opacity:.85}
.hero-stats b{display:block;font-size:clamp(12px,3.4vw,16px);margin-top:2px;overflow-wrap:anywhere}

.quick{display:flex;justify-content:space-around;gap:8px;margin:0 0 18px}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-weight:600;font-size:13px;padding:0 4px;color:var(--ink)}
.qi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.qi.in{color:var(--in)}.qi.out{color:var(--out)}.qi.inv{color:var(--inv)}

.cards{display:grid;gap:16px}
@media(min-width:860px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h2{margin:0 0 12px;font-size:16px}

.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.dt1{font-size:3px;fill:var(--ink-2);text-anchor:middle}
.dt2{font-size:3.6px;font-weight:700;fill:var(--ink);text-anchor:middle}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:190px;display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14px}
.legend small{color:var(--ink-2)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

.budget{display:grid;gap:14px}
.bh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.warn i{background:#E0A100}
.bar.over i{background:var(--out)}
.bnote{font-size:12px;color:var(--ink-2);margin:4px 0 0}

.chart{width:100%;height:auto}
.b-in{fill:var(--in)}.b-out{fill:var(--out)}
.ax{stroke:var(--line)}
.lbl-m{font-size:9px;fill:var(--ink-2);text-anchor:middle}
.legend-inline{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin-top:6px}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}

/* ---- listas ---- */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 14px}
.pagehead h1{margin:0;font-size:26px}
.ptotal{margin:0;font-size:22px;font-weight:800}
.ptotal.in{color:var(--in)}.ptotal.out{color:var(--out)}.ptotal.inv{color:var(--inv)}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.searchbox{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;color:var(--ink-2)}
.searchbox:focus-within{border-color:var(--brand-ink)}
.searchbox input{flex:1;border:0;background:none;padding:12px 0;outline:none;min-width:0;font-size:16px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;color:var(--ink)}
.chip.on{border-color:var(--brand-ink);background:rgba(130,10,209,.12);font-weight:700}
.chip.add{border-style:dashed;color:var(--brand-ink);font-weight:600}

.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:rgba(130,10,209,.06)}
.ico{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain small{display:block;color:var(--ink-2);font-size:13px}
.rval{font-weight:700;font-size:15px;white-space:nowrap}
.rval.receita{color:var(--in)}.rval.despesa{color:var(--out)}.rval.investimento{color:var(--inv)}
.day{margin:20px 4px 8px;font-size:14px;color:var(--ink-2);font-weight:600}
.empty{text-align:center;color:var(--ink-2);padding:26px 12px}
.empty p{margin:0 0 14px}
.muted{color:var(--ink-2);margin:0;font-size:14px}
.filtered{margin:10px 4px 0}

/* ---- botões e formulários ---- */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:transparent;border:1.5px solid rgba(209,47,88,.45);color:var(--out)}
.btn.sm{padding:10px 14px;font-size:14px}
.grow{flex:1}
.stack{display:grid;gap:10px;margin-top:14px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:11px;padding:10px 4px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{color:#fff}
.seg button.on.in{background:var(--in-solid)}
.seg button.on.out{background:var(--out-solid)}
.seg button.on.inv{background:var(--inv-solid)}

.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(130,10,209,.20)}
#f-valor{font-size:28px;font-weight:800;padding:14px}
.grid2{display:grid;grid-template-columns:96px 1fr;gap:12px}
.newtag{display:flex;gap:8px;margin-top:10px}
.newtag input{flex:1;min-width:0;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.err{color:var(--out);min-height:20px;margin:0 0 8px;font-size:14px}
.sheet-actions{display:flex;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(14,9,24,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.overlay{align-items:center}.sheet{border-radius:26px;padding-bottom:22px}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.toast{transition:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:20px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.toast{bottom:28px}}
.banner{background:#FFF1D6;color:#5C3B00;border-radius:14px;padding:12px 14px;font-size:14px;margin:4px 0 12px}
noscript p{padding:20px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">R$</span>
      <div><strong>Controle Financeiro</strong><small>Receitas, despesas e investimentos</small></div>
    </div>
    <button class="icon" data-action="data-menu" aria-label="Dados e backup"><span data-icon="more"></span></button>
    <div class="monthnav">
      <button class="icon" data-action="prev-month" aria-label="Mês anterior"><span data-icon="left"></span></button>
      <button class="month" id="month-label" data-action="today-month" title="Voltar ao mês atual"></button>
      <button class="icon" data-action="next-month" aria-label="Próximo mês"><span data-icon="right"></span></button>
    </div>
  </header>

  <nav class="tabs" aria-label="Seções">
    <button class="tab" data-action="nav" data-view="resumo"><span data-icon="home"></span>Resumo</button>
    <button class="tab" data-action="nav" data-view="receitas"><span data-icon="up"></span>Receitas</button>
    <button class="tab" data-action="nav" data-view="despesas"><span data-icon="down"></span>Despesas</button>
    <button class="tab" data-action="nav" data-view="investimentos"><span data-icon="trend"></span>Investir</button>
    <button class="tab" data-action="nav" data-view="tags"><span data-icon="tag"></span>Tags</button>
  </nav>

  <div class="banner" id="banner" role="status" hidden>Seu navegador está bloqueando o armazenamento local. Os lançamentos não serão guardados ao fechar a página. Use "Dados e backup" para baixar uma cópia.</div>
  <noscript><p>Ative o JavaScript para usar o Controle Financeiro.</p></noscript>
  <main id="content"></main>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   Constantes
   ===================================================================== */
var KEY = 'controleFinanceiro.v1';
var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
var TIPOS = {
  receita:      {one:'receita',      plural:'Receitas',      novo:'Nova receita',      editar:'Editar receita',      salvo:'Receita salva',      cls:'in'},
  despesa:      {one:'despesa',      plural:'Despesas',      novo:'Nova despesa',      editar:'Editar despesa',      salvo:'Despesa salva',      cls:'out'},
  investimento: {one:'investimento', plural:'Investimentos', novo:'Novo investimento', editar:'Editar investimento', salvo:'Investimento salvo', cls:'inv'}
};
var VIEW_TYPE = {receitas:'receita', despesas:'despesa', investimentos:'investimento'};
var PALETA = ['#820AD1','#FF7A00','#0F7A57','#D12F58','#2F6FED','#C9A100','#0E9AA7','#8A5A44','#6D4AFF','#E0559D','#4C9A2A','#5F6B7A'];
var PAGAMENTOS = ['Pix','Débito','Crédito','Dinheiro','Boleto','Transferência'];
var NOTAG = {id:'_none', name:'Sem tag', emoji:'🏷️', color:'#9A94AB', limit:0};

/* =====================================================================
   Utilidades
   ===================================================================== */
function $(s, el){ return (el || document).querySelector(s); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
var fmt = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
var fmtInt = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
function money(n){ return fmt.format(n || 0); }
function pad(n){ return String(n).padStart(2, '0'); }
function isoOf(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function addDays(iso, n){
  var p = iso.split('-').map(Number);
  return isoOf(new Date(p[0], p[1] - 1, p[2] + n));
}
function ymOf(iso){ return iso.slice(0, 7); }
function shiftYM(ym, delta){
  var p = ym.split('-').map(Number), y = p[0], m = p[1] + delta;
  while (m > 12){ m -= 12; y++; }
  while (m < 1){ m += 12; y--; }
  return y + '-' + pad(m);
}
function ymLabel(ym){ var p = ym.split('-').map(Number); return MESES[p[1] - 1] + ' ' + p[0]; }
function dayLabel(iso){
  var p = iso.split('-').map(Number);
  var dt = new Date(p[0], p[1] - 1, p[2]);
  var base = DIAS[dt.getDay()] + ', ' + p[2] + ' ' + MESES[p[1] - 1].slice(0, 3).toLowerCase();
  var t = todayISO();
  if (iso === t) return 'Hoje, ' + base;
  if (iso === addDays(t, -1)) return 'Ontem, ' + base;
  return base;
}
function parseValor(s){
  s = String(s || '').replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  var n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
function valorInput(n){ return n.toFixed(2).replace('.', ','); }

var ICONS = {
  home:'<path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>',
  up:'<path d="M7 17L17 7M8 7h9v9"/>',
  down:'<path d="M17 7L7 17M16 17H7V8"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  tag:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  left:'<path d="M15 6l-6 6 6 6"/>',
  right:'<path d="M9 6l6 6-6 6"/>',
  more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'
};
function icon(name, size){
  size = size || 22;
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
}

/* =====================================================================
   Dados (guardados no navegador)
   ===================================================================== */
var storageOk = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOk = false; }

function seed(){
  function mk(type, name, emoji, color){ return {id:uid(), type:type, name:name, emoji:emoji, color:color, limit:0}; }
  return {v:1, tx:[], tags:[
    mk('despesa','Alimentação','🍽️','#D12F58'),
    mk('despesa','Mercado','🛒','#0F7A57'),
    mk('despesa','Posto','⛽','#FF7A00'),
    mk('despesa','Moradia','🏠','#2F6FED'),
    mk('despesa','Transporte','🚗','#0E9AA7'),
    mk('despesa','Saúde','💊','#E0559D'),
    mk('despesa','Lazer','🎉','#820AD1'),
    mk('despesa','Educação','📚','#C9A100'),
    mk('despesa','Contas','🧾','#5F6B7A'),
    mk('receita','Salário','💼','#0F7A57'),
    mk('receita','Extra','✨','#820AD1'),
    mk('receita','Outros','💰','#2F6FED'),
    mk('investimento','Renda fixa','🏦','#2F6FED'),
    mk('investimento','Ações','📈','#0F7A57'),
    mk('investimento','FIIs','🏢','#FF7A00'),
    mk('investimento','Cripto','🪙','#C9A100'),
    mk('investimento','Reserva','🛟','#820AD1')
  ]};
}
function sanitize(o){
  if (!o || !Array.isArray(o.tags) || !Array.isArray(o.tx)) throw new Error('Arquivo inválido');
  var types = Object.keys(TIPOS);
  var tags = o.tags.filter(function(t){ return t && types.indexOf(t.type) >= 0 && t.id && t.name; }).map(function(t){
    return {
      id:String(t.id), type:t.type, name:String(t.name).slice(0, 40),
      emoji:String(t.emoji || '🏷️').slice(0, 8),
      color:/^#[0-9a-f]{6}$/i.test(t.color) ? t.color : '#5F6B7A',
      limit:Number(t.limit) > 0 ? Number(t.limit) : 0
    };
  });
  var tx = o.tx.filter(function(t){
    return t && types.indexOf(t.type) >= 0 && Number(t.value) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date);
  }).map(function(t){
    return {
      id:String(t.id || uid()), ts:Number(t.ts) || 0, type:t.type,
      desc:String(t.desc || '').slice(0, 120),
      value:Math.round(Number(t.value) * 100) / 100, date:t.date,
      tagId:String(t.tagId || ''), pay:String(t.pay || '').slice(0, 30),
      note:String(t.note || '').slice(0, 200)
    };
  });
  return {v:1, tags:tags, tx:tx};
}
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) return sanitize(JSON.parse(raw));
  } catch (e) {}
  return seed();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; $('#banner').hidden = false; }
}

var state = load();
var ui = {
  view:'resumo', ym:todayISO().slice(0, 7), search:'', tagTab:'despesa',
  filterTag:{receita:'', despesa:'', investimento:''}
};
var sheet = null;
var lastFocus = null;

function tagById(id){ return state.tags.filter(function(t){ return t.id === id; })[0]; }
function tagsOf(type){ return state.tags.filter(function(t){ return t.type === type; }); }
function tagOf(t){ return tagById(t.tagId) || NOTAG; }
function txMonth(ym, type){ return state.tx.filter(function(t){ return ymOf(t.date) === ym && (!type || t.type === type); }); }
function sum(arr){ return arr.reduce(function(a, t){ return a + t.value; }, 0); }
function byRecent(a, b){ return b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0); }
function nextColor(type){ return PALETA[tagsOf(type).length % PALETA.length]; }
function groupByTag(type, ym){
  var m = {};
  txMonth(ym, type).forEach(function(t){
    var k = tagById(t.tagId) ? t.tagId : '_none';
    m[k] = (m[k] || 0) + t.value;
  });
  return Object.keys(m).map(function(k){
    return {tag:k === '_none' ? NOTAG : tagById(k), total:m[k]};
  }).sort(function(a, b){ return b.total - a.total; });
}

/* =====================================================================
   Telas
   ===================================================================== */
function rowHTML(t){
  var tag = tagOf(t);
  var sign = t.type === 'receita' ? '+' : (t.type === 'despesa' ? '−' : '');
  var sub = esc(tag.name) + (t.pay ? ', ' + esc(t.pay) : '');
  return '<button class="row" data-action="edit" data-id="' + esc(t.id) + '">' +
    '<span class="ico" style="background:' + tag.color + '22">' + esc(tag.emoji) + '</span>' +
    '<span class="rmain"><b>' + esc(t.desc) + '</b><small>' + sub + '</small></span>' +
    '<span class="rval ' + t.type + '">' + sign + money(t.value) + '</span></button>';
}

function donut(groups, total){
  if (!total) return '<div class="empty"><p>Nenhuma despesa neste mês.</p><button class="btn btn-primary sm" data-action="add" data-type="despesa">Nova despesa</button></div>';
  var cum = 0;
  var segs = groups.map(function(g){
    var p = g.total / total * 100;
    var s = '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + g.tag.color + '" stroke-width="6" stroke-dasharray="' + p.toFixed(3) + ' ' + (100 - p).toFixed(3) + '" stroke-dashoffset="' + (25 - cum).toFixed(3) + '"/>';
    cum += p;
    return s;
  }).join('');
  var legend = groups.map(function(g){
    return '<li><i class="cdot" style="background:' + g.tag.color + '"></i><span>' + esc(g.tag.emoji) + ' ' + esc(g.tag.name) + '</span><span><b>' + money(g.total) + '</b> <small>' + Math.round(g.total / total * 100) + '%</small></span></li>';
  }).join('');
  return '<div class="donutwrap"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Despesas por tag">' +
    '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="6"/>' + segs +
    '<text x="21" y="20.2" class="dt1">Total</text><text x="21" y="25" class="dt2">' + fmtInt.format(total) + '</text></svg>' +
    '<ul class="legend">' + legend + '</ul></div>';
}

function budgetCard(ym){
  var items = tagsOf('despesa').filter(function(t){ return t.limit > 0; }).map(function(t){
    var spent = sum(txMonth(ym, 'despesa').filter(function(x){ return x.tagId === t.id; }));
    return {t:t, spent:spent, pct:spent / t.limit * 100};
  }).sort(function(a, b){ return b.pct - a.pct; });
  if (!items.length){
    return '<section class="card"><h2>Orçamento por tag</h2><p class="muted">Defina um limite mensal em uma tag de despesa, na aba Tags, e acompanhe o quanto já gastou aqui.</p></section>';
  }
  var html = items.map(function(i){
    var cls = i.pct >= 100 ? 'over' : (i.pct >= 80 ? 'warn' : '');
    var left = i.t.limit - i.spent;
    var note = left >= 0 ? 'Restam ' + money(left) : 'Passou ' + money(-left) + ' do limite';
    return '<div><div class="bh"><span>' + esc(i.t.emoji) + ' ' + esc(i.t.name) + '</span><span><b>' + money(i.spent) + '</b> de ' + money(i.t.limit) + '</span></div>' +
      '<div class="bar ' + cls + '"><i style="width:' + Math.min(100, i.pct).toFixed(1) + '%"></i></div><p class="bnote">' + note + '</p></div>';
  }).join('');
  return '<section class="card"><h2>Orçamento por tag</h2><div class="budget">' + html + '</div></section>';
}

function monthsChart(ym){
  var arr = [];
  for (var i = 5; i >= 0; i--){
    var m = shiftYM(ym, -i);
    arr.push({m:m, rec:sum(txMonth(m, 'receita')), des:sum(txMonth(m, 'despesa'))});
  }
  var max = Math.max.apply(null, [1].concat(arr.map(function(a){ return Math.max(a.rec, a.des); })));
  var bars = arr.map(function(a, i){
    var x0 = 14 + i * 47;
    var hr = a.rec ? Math.max(2, a.rec / max * 84) : 0;
    var hd = a.des ? Math.max(2, a.des / max * 84) : 0;
    var label = MESES[Number(a.m.slice(5)) - 1].slice(0, 3);
    return '<rect class="b-in" x="' + x0 + '" y="' + (100 - hr) + '" width="15" height="' + hr + '" rx="3"><title>Receitas ' + label + ': ' + money(a.rec) + '</title></rect>' +
      '<rect class="b-out" x="' + (x0 + 17) + '" y="' + (100 - hd) + '" width="15" height="' + hd + '" rx="3"><title>Despesas ' + label + ': ' + money(a.des) + '</title></rect>' +
      '<text class="lbl-m" x="' + (x0 + 16) + '" y="116">' + label + '</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 300 124" role="img" aria-label="Receitas e despesas nos últimos 6 meses"><line class="ax" x1="6" x2="294" y1="100.5" y2="100.5"/>' + bars + '</svg>' +
    '<div class="legend-inline"><span><i class="cdot" style="background:var(--in)"></i>Receitas</span><span><i class="cdot" style="background:var(--out)"></i>Despesas</span></div>';
}

function renderResumo(){
  var ym = ui.ym;
  var rec = sum(txMonth(ym, 'receita')), des = sum(txMonth(ym, 'despesa')), inv = sum(txMonth(ym, 'investimento'));
  var saldo = rec - des - inv;
  var recent = txMonth(ym).sort(byRecent).slice(0, 6);
  var recentHTML = recent.length
    ? '<div class="group">' + recent.map(rowHTML).join('') + '</div>'
    : '<div class="empty"><p>Nada lançado em ' + ymLabel(ym) + ' ainda.</p></div>';
  return '<section class="hero"><p class="hero-label">Saldo de ' + ymLabel(ym) + '</p>' +
    '<p class="hero-value' + (saldo < 0 ? ' neg' : '') + '">' + money(saldo) + '</p>' +
    '<p class="hero-note">Receitas menos despesas e investimentos do mês</p>' +
    '<div class="hero-stats"><div><span>Receitas</span><b>' + money(rec) + '</b></div><div><span>Despesas</span><b>' + money(des) + '</b></div><div><span>Investido</span><b>' + money(inv) + '</b></div></div></section>' +
    '<div class="quick">' +
      '<button class="q" data-action="add" data-type="receita"><span class="qi in">' + icon('up', 26) + '</span>Receita</button>' +
      '<button class="q" data-action="add" data-type="despesa"><span class="qi out">' + icon('down', 26) + '</span>Despesa</button>' +
      '<button class="q" data-action="add" data-type="investimento"><span class="qi inv">' + icon('trend', 26) + '</span>Investir</button>' +
    '</div>' +
    '<div class="cards">' +
      '<section class="card"><h2>Para onde foi o dinheiro</h2>' + donut(groupByTag('despesa', ym), des) + '</section>' +
      budgetCard(ym) +
      '<section class="card"><h2>Últimos 6 meses</h2>' + monthsChart(ym) + '</section>' +
      '<section class="card"><h2>Últimas movimentações</h2>' + recentHTML + '</section>' +
    '</div>';
}

function matchTag(t, f){
  if (!f) return true;
  if (f === '_none') return !tagById(t.tagId);
  return t.tagId === f;
}
function listBody(type){
  var q = ui.search.trim().toLowerCase(), f = ui.filterTag[type];
  var items = txMonth(ui.ym, type).filter(function(t){
    return matchTag(t, f) && (!q || (t.desc + ' ' + tagOf(t).name + ' ' + (t.note || '')).toLowerCase().indexOf(q) >= 0);
  });
  if (!items.length){
    if (f || q) return '<div class="empty"><p>Nada encontrado com esse filtro.</p></div>';
    return '<div class="empty"><p>Nenhuma ' + TIPOS[type].one + ' em ' + ymLabel(ui.ym) + '.</p><button class="btn btn-primary" data-action="add" data-type="' + type + '">' + TIPOS[type].novo + '</button></div>';
  }
  items.sort(byRecent);
  var days = [];
  items.forEach(function(t){
    var last = days[days.length - 1];
    if (last && last.date === t.date) last.items.push(t); else days.push({date:t.date, items:[t]});
  });
  var info = (f || q) ? '<p class="muted filtered">' + items.length + ' resultado' + (items.length > 1 ? 's' : '') + ', total de ' + money(sum(items)) + '</p>' : '';
  return info + days.map(function(d){
    return '<h3 class="day">' + dayLabel(d.date) + '</h3><div class="group">' + d.items.map(rowHTML).join('') + '</div>';
  }).join('');
}
function renderList(type){
  var T = TIPOS[type], all = txMonth(ui.ym, type), f = ui.filterTag[type];
  var chips = '<button class="chip' + (!f ? ' on' : '') + '" data-action="filter-tag" data-id="">Todas</button>' +
    tagsOf(type).map(function(t){
      return '<button class="chip' + (f === t.id ? ' on' : '') + '" data-action="filter-tag" data-id="' + esc(t.id) + '"><i class="cdot" style="background:' + t.color + '"></i>' + esc(t.name) + '</button>';
    }).join('') +
    (all.some(function(t){ return !tagById(t.tagId); }) ? '<button class="chip' + (f === '_none' ? ' on' : '') + '" data-action="filter-tag" data-id="_none">Sem tag</button>' : '');
  return '<div class="pagehead"><div><h1>' + T.plural + '</h1><p class="muted">' + all.length + ' em ' + ymLabel(ui.ym) + '</p></div><p class="ptotal ' + T.cls + '">' + money(sum(all)) + '</p></div>' +
    '<div class="toolbar"><div class="searchbox">' + icon('search', 18) + '<input id="search" type="search" placeholder="Buscar" aria-label="Buscar em ' + T.plural.toLowerCase() + '" value="' + esc(ui.search) + '"></div>' +
    '<button class="btn btn-primary" data-action="add" data-type="' + type + '">' + icon('plus', 18) + ' ' + T.novo + '</button></div>' +
    '<div class="chips scroll" role="group" aria-label="Filtrar por tag">' + chips + '</div>' +
    '<div id="list-body">' + listBody(type) + '</div>';
}

function renderTags(){
  var type = ui.tagTab, ym = ui.ym;
  var seg = '<div class="seg" role="group" aria-label="Tipo de tag">' + Object.keys(TIPOS).map(function(k){
    return '<button data-action="tag-tab" data-type="' + k + '" class="' + TIPOS[k].cls + (k === type ? ' on' : '') + '">' + TIPOS[k].plural + '</button>';
  }).join('') + '</div>';
  var tags = tagsOf(type);
  var rows = tags.map(function(t){
    var spent = sum(txMonth(ym, type).filter(function(x){ return x.tagId === t.id; }));
    var n = state.tx.filter(function(x){ return x.tagId === t.id; }).length;
    var sub = money(spent) + ' em ' + ymLabel(ym);
    if (type === 'despesa' && t.limit > 0) sub += ', limite de ' + money(t.limit);
    return '<button class="row" data-action="tag-edit" data-id="' + esc(t.id) + '"><span class="ico" style="background:' + t.color + '22">' + esc(t.emoji) + '</span>' +
      '<span class="rmain"><b>' + esc(t.name) + '</b><small>' + sub + '</small></span><span class="muted">' + n + (n === 1 ? ' lançamento' : ' lançamentos') + '</span></button>';
  }).join('');
  return '<div class="pagehead"><div><h1>Tags</h1><p class="muted">Crie quantas quiser. Elas organizam e somam seus lançamentos.</p></div></div>' + seg +
    '<div class="toolbar"><button class="btn btn-primary" data-action="tag-new">' + icon('plus', 18) + ' Nova tag</button></div>' +
    (rows ? '<div class="group">' + rows + '</div>' : '<div class="empty"><p>Nenhuma tag de ' + TIPOS[type].one + ' ainda.</p></div>');
}

var VIEWS = {
  resumo:renderResumo,
  receitas:function(){ return renderList('receita'); },
  despesas:function(){ return renderList('despesa'); },
  investimentos:function(){ return renderList('investimento'); },
  tags:renderTags
};

function render(){
  $('#month-label').textContent = ymLabel(ui.ym);
  document.querySelectorAll('.tab').forEach(function(b){
    var on = b.dataset.view === ui.view;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#banner').hidden = storageOk;
  $('#content').innerHTML = VIEWS[ui.view]();
}

/* =====================================================================
   Janelas (lançamento, tag, dados)
   ===================================================================== */
function mountSheet(html){
  lastFocus = document.activeElement;
  $('#sheet-root').innerHTML = '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  $('#sheet-root').innerHTML = '';
  document.body.style.overflow = '';
  sheet = null;
  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
}
var toastTimer;
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
function defaultDate(){
  var t = todayISO();
  return ymOf(t) === ui.ym ? t : ui.ym + '-01';
}

function openTxSheet(type, id){
  var ex = id ? state.tx.filter(function(t){ return t.id === id; })[0] : null;
  sheet = {kind:'tx', id:ex ? ex.id : null, type:ex ? ex.type : type, tagId:ex ? ex.tagId : '', editing:!!ex};
  var v = ex ? {desc:ex.desc, valor:valorInput(ex.value), date:ex.date, pay:ex.pay, note:ex.note || ''}
             : {desc:'', valor:'', date:defaultDate(), pay:'Pix', note:''};
  var seg = ex ? '' : '<div class="seg" id="type-seg" role="group" aria-label="Tipo de lançamento">' + Object.keys(TIPOS).map(function(k){
    return '<button type="button" data-action="set-type" data-type="' + k + '" class="' + TIPOS[k].cls + '">' + TIPOS[k].plural + '</button>';
  }).join('') + '</div>';
  mountSheet(
    '<div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon" data-action="close-sheet" aria-label="Fechar">' + icon('x') + '</button></div>' + seg +
    '<form id="tx-form" novalidate>' +
      '<div class="field"><label for="f-valor">Valor</label><input id="f-valor" inputmode="decimal" autocomplete="off" placeholder="0,00" value="' + esc(v.valor) + '"></div>' +
      '<div class="field"><label for="f-desc">Descrição</label><input id="f-desc" maxlength="120" autocomplete="off" placeholder="Ex.: Supermercado" value="' + esc(v.desc) + '"></div>' +
      '<div class="field"><label for="f-data">Data</label><input id="f-data" type="date" value="' + esc(v.date) + '"></div>' +
      '<div class="field"><span class="lbl" id="lbl-tag">Tag</span><div class="chips" id="tag-chips" role="group" aria-labelledby="lbl-tag"></div>' +
        '<div class="newtag" id="newtag" hidden><input id="f-newtag" maxlength="30" autocomplete="off" placeholder="Nome da nova tag" aria-label="Nome da nova tag"><button type="button" class="btn btn-primary sm" data-action="newtag-save">Criar tag</button></div></div>' +
      '<div class="field" id="pay-field"><label for="f-pay">Forma de pagamento</label><select id="f-pay">' +
        PAGAMENTOS.map(function(p){ return '<option' + (p === v.pay ? ' selected' : '') + '>' + p + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="f-note">Observação (opcional)</label><input id="f-note" maxlength="200" autocomplete="off" value="' + esc(v.note) + '"></div>' +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="sheet-actions">' + (ex ? '<button type="button" class="btn btn-danger" data-action="tx-delete">Excluir</button>' : '') +
        '<button type="submit" class="btn btn-primary grow">Salvar</button></div>' +
    '</form>');
  applyTypeUI();
  if (!ex) $('#f-valor').focus();
}
function applyTypeUI(){
  var T = TIPOS[sheet.type];
  $('#sheet-title').textContent = sheet.editing ? T.editar : T.novo;
  document.querySelectorAll('#type-seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.type === sheet.type); });
  $('#pay-field').hidden = sheet.type !== 'despesa';
  refreshTagChips();
}
function refreshTagChips(){
  var chips = tagsOf(sheet.type).map(function(t){
    return '<button type="button" class="chip' + (sheet.tagId === t.id ? ' on' : '') + '" data-action="pick-tag" data-id="' + esc(t.id) + '" aria-pressed="' + (sheet.tagId === t.id) + '"><i class="cdot" style="background:' + t.color + '"></i>' + esc(t.emoji) + ' ' + esc(t.name) + '</button>';
  }).join('');
  $('#tag-chips').innerHTML = chips + '<button type="button" class="chip add" data-action="newtag-toggle">' + icon('plus', 14) + ' Nova tag</button>';
}
function quickAddTag(){
  var inp = $('#f-newtag'), name = cap(inp.value.trim());
  if (!name) return;
  var tag = tagsOf(sheet.type).filter(function(t){ return t.name.toLowerCase() === name.toLowerCase(); })[0];
  if (!tag){
    tag = {id:uid(), type:sheet.type, name:name, emoji:'🏷️', color:nextColor(sheet.type), limit:0};
    state.tags.push(tag);
    save();
  }
  sheet.tagId = tag.id;
  inp.value = '';
  $('#newtag').hidden = true;
  $('#f-err').textContent = '';
  refreshTagChips();
}
function saveTx(){
  var err = $('#f-err');
  var value = parseValor($('#f-valor').value);
  var date = $('#f-data').value;
  if (!(value > 0)){ err.textContent = 'Informe um valor maior que zero.'; $('#f-valor').focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)){ err.textContent = 'Informe a data.'; $('#f-data').focus(); return; }
  var tag = tagById(sheet.tagId);
  if (!tag || tag.type !== sheet.type){ err.textContent = 'Escolha uma tag ou crie uma nova.'; return; }
  var rec = {
    type:sheet.type, desc:$('#f-desc').value.trim() || tag.name, value:value, date:date, tagId:tag.id,
    pay:sheet.type === 'despesa' ? $('#f-pay').value : '', note:$('#f-note').value.trim()
  };
  var label = TIPOS[sheet.type].salvo;
  if (sheet.id){
    Object.assign(state.tx.filter(function(x){ return x.id === sheet.id; })[0], rec);
  } else {
    rec.id = uid(); rec.ts = Date.now();
    state.tx.push(rec);
  }
  save();
  ui.ym = ymOf(date);
  closeSheet();
  render();
  toast(label);
}
function deleteTx(){
  if (!confirm('Excluir este lançamento?')) return;
  state.tx = state.tx.filter(function(x){ return x.id !== sheet.id; });
  save(); closeSheet(); render(); toast('Lançamento excluído');
}

function openTagSheet(type, id){
  var ex = id ? tagById(id) : null, tp = ex ? ex.type : type;
  sheet = {kind:'tag', id:ex ? ex.id : null, type:tp, color:ex ? ex.color : nextColor(tp)};
  mountSheet(
    '<div class="sheet-head"><h2>' + (ex ? 'Editar tag' : 'Nova tag') + ' de ' + TIPOS[tp].one + '</h2><button class="icon" data-action="close-sheet" aria-label="Fechar">' + icon('x') + '</button></div>' +
    '<form id="tag-form" novalidate>' +
      '<div class="grid2"><div class="field"><label for="t-emoji">Ícone</label><input id="t-emoji" maxlength="8" value="' + esc(ex ? ex.emoji : '🏷️') + '"></div>' +
      '<div class="field"><label for="t-name">Nome</label><input id="t-name" maxlength="30" autocomplete="off" value="' + esc(ex ? ex.name : '') + '"></div></div>' +
      '<div class="field"><span class="lbl">Cor</span><div class="swatches" id="swatches">' + PALETA.map(function(c){
        return '<button type="button" class="sw' + (c === sheet.color ? ' on' : '') + '" data-action="pick-color" data-color="' + c + '" style="background:' + c + '" aria-label="Cor ' + c + '"></button>';
      }).join('') + '</div></div>' +
      (tp === 'despesa' ? '<div class="field"><label for="t-limit">Limite mensal (opcional)</label><input id="t-limit" inputmode="decimal" placeholder="0,00" value="' + (ex && ex.limit ? valorInput(ex.limit) : '') + '"></div>' : '') +
      '<p class="err" id="t-err" role="alert"></p>' +
      '<div class="sheet-actions">' + (ex ? '<button type="button" class="btn btn-danger" data-action="tag-delete">Excluir</button>' : '') +
        '<button type="submit" class="btn btn-primary grow">Salvar</button></div>' +
    '</form>');
  if (!ex) $('#t-name').focus();
}
function saveTag(){
  var err = $('#t-err');
  var name = cap($('#t-name').value.trim());
  var emoji = $('#t-emoji').value.trim() || '🏷️';
  if (!name){ err.textContent = 'Dê um nome para a tag.'; $('#t-name').focus(); return; }
  var dup = state.tags.filter(function(t){ return t.type === sheet.type && t.id !== sheet.id && t.name.toLowerCase() === name.toLowerCase(); })[0];
  if (dup){ err.textContent = 'Já existe uma tag com esse nome.'; return; }
  var limit = 0, lim = $('#t-limit');
  if (lim && lim.value.trim()){
    limit = parseValor(lim.value);
    if (!(limit >= 0)){ err.textContent = 'Limite inválido.'; return; }
  }
  if (sheet.id) Object.assign(tagById(sheet.id), {name:name, emoji:emoji, color:sheet.color, limit:limit});
  else state.tags.push({id:uid(), type:sheet.type, name:name, emoji:emoji, color:sheet.color, limit:limit});
  save(); closeSheet(); render(); toast('Tag salva');
}
function deleteTag(){
  var t = tagById(sheet.id);
  if (!t) return;
  var n = state.tx.filter(function(x){ return x.tagId === t.id; }).length;
  var msg = 'Excluir a tag "' + t.name + '"?' + (n ? ' ' + n + (n > 1 ? ' lançamentos ficarão' : ' lançamento ficará') + ' sem tag.' : '');
  if (!confirm(msg)) return;
  state.tags = state.tags.filter(function(x){ return x.id !== t.id; });
  Object.keys(ui.filterTag).forEach(function(k){ if (ui.filterTag[k] === t.id) ui.filterTag[k] = ''; });
  save(); closeSheet(); render(); toast('Tag excluída');
}

function openDataSheet(){
  sheet = {kind:'data'};
  mountSheet(
    '<div class="sheet-head"><h2>Dados e backup</h2><button class="icon" data-action="close-sheet" aria-label="Fechar">' + icon('x') + '</button></div>' +
    '<p class="muted">Seus lançamentos ficam salvos neste aparelho, no navegador. Baixe um backup de vez em quando; é também assim que você leva os dados para outro aparelho.</p>' +
    '<div class="stack">' +
      '<button class="btn btn-ghost" data-action="export-json">Baixar backup (.json)</button>' +
      '<button class="btn btn-ghost" data-action="import-json">Restaurar backup</button>' +
      '<input type="file" id="f-import" accept="application/json,.json" hidden>' +
      '<button class="btn btn-ghost" data-action="export-csv">Baixar planilha (.csv)</button>' +
      '<button class="btn btn-danger" data-action="wipe">Apagar todos os dados</button>' +
    '</div>');
}
function download(name, mime, text){
  var blob = new Blob([text], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function exportJSON(){
  download('controle-financeiro-backup-' + todayISO() + '.json', 'application/json', JSON.stringify(state, null, 2));
  toast('Backup baixado');
}
function exportCSV(){
  function safe(v){ v = String(v == null ? '' : v); return /^[=+\-@]/.test(v) ? "'" + v : v; }
  function q(v){ return '"' + safe(v).replace(/"/g, '""') + '"'; }
  var rows = [['Data','Tipo','Descrição','Tag','Valor','Pagamento','Observação'].map(q).join(';')];
  state.tx.slice().sort(function(a, b){ return a.date.localeCompare(b.date); }).forEach(function(t){
    rows.push([t.date, TIPOS[t.type].one, t.desc, tagOf(t).name, String(t.value).replace('.', ','), t.pay, t.note].map(q).join(';'));
  });
  download('controle-financeiro.csv', 'text/csv;charset=utf-8', '\ufeff' + rows.join('\r\n'));
  toast('Planilha baixada');
}
function importJSON(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = sanitize(JSON.parse(reader.result));
      if (!confirm('Restaurar o backup? Os dados atuais deste aparelho serão substituídos (' + data.tx.length + ' lançamentos e ' + data.tags.length + ' tags).')) return;
      state = data; save(); closeSheet(); render(); toast('Backup restaurado');
    } catch (e) {
      alert('Não foi possível ler esse arquivo. Use um backup baixado por este app.');
    }
  };
  reader.readAsText(file);
}

/* =====================================================================
   Eventos
   ===================================================================== */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el){
    if (sheet && e.target.classList && e.target.classList.contains('overlay')) closeSheet();
    return;
  }
  var d = el.dataset;
  switch (d.action){
    case 'nav': ui.view = d.view; ui.search = ''; render(); window.scrollTo(0, 0); break;
    case 'prev-month': ui.ym = shiftYM(ui.ym, -1); render(); break;
    case 'next-month': ui.ym = shiftYM(ui.ym, 1); render(); break;
    case 'today-month': ui.ym = todayISO().slice(0, 7); render(); break;
    case 'add': openTxSheet(d.type); break;
    case 'edit': openTxSheet(null, d.id); break;
    case 'close-sheet': closeSheet(); break;
    case 'set-type': sheet.type = d.type; sheet.tagId = ''; applyTypeUI(); break;
    case 'pick-tag': sheet.tagId = d.id; $('#f-err').textContent = ''; refreshTagChips(); break;
    case 'newtag-toggle': var nt = $('#newtag'); nt.hidden = !nt.hidden; if (!nt.hidden) $('#f-newtag').focus(); break;
    case 'newtag-save': quickAddTag(); break;
    case 'tx-delete': deleteTx(); break;
    case 'filter-tag':
      var ty = VIEW_TYPE[ui.view];
      ui.filterTag[ty] = (ui.filterTag[ty] === d.id) ? '' : d.id;
      render();
      break;
    case 'tag-tab': ui.tagTab = d.type; render(); break;
    case 'tag-new': openTagSheet(ui.tagTab); break;
    case 'tag-edit': openTagSheet(null, d.id); break;
    case 'tag-delete': deleteTag(); break;
    case 'pick-color':
      sheet.color = d.color;
      document.querySelectorAll('.sw').forEach(function(b){ b.classList.toggle('on', b.dataset.color === d.color); });
      break;
    case 'data-menu': openDataSheet(); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-json': $('#f-import').click(); break;
    case 'wipe':
      if (confirm('Apagar TODOS os lançamentos e tags deste aparelho? Isso não pode ser desfeito.') && confirm('Tem certeza? Se precisar, baixe um backup antes.')){
        state = seed(); save(); closeSheet(); render(); toast('Dados apagados');
      }
      break;
  }
});
document.addEventListener('submit', function(e){
  e.preventDefault();
  if (e.target.id === 'tx-form') saveTx();
  else if (e.target.id === 'tag-form') saveTag();
});
document.addEventListener('input', function(e){
  if (e.target.id === 'search'){
    ui.search = e.target.value;
    $('#list-body').innerHTML = listBody(VIEW_TYPE[ui.view]);
  }
});
document.addEventListener('change', function(e){
  if (e.target.id === 'f-import' && e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && sheet) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'f-newtag'){ e.preventDefault(); quickAddTag(); }
});
window.addEventListener('storage', function(e){
  if (e.key === KEY && !sheet){ state = load(); render(); }
});

document.querySelectorAll('[data-icon]').forEach(function(el){ el.innerHTML = icon(el.dataset.icon); });
render();
})();
</script>
</body>
</html>
